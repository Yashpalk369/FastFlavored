<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinterest Pin: Creamy Garlic Butter Tuscan Chicken</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #eee4dc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Outfit', sans-serif;
    }
    .pin-canvas {
      width: 1000px;
      height: 1500px;
      background: #fdfaf6;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px 70px;
      box-shadow: 0 30px 60px -15px rgba(184, 69, 35, 0.25);
      border: 8px solid #f2e1d2;
    }
    .badge-pill {
      align-self: flex-start;
      background: #c84b23;
      color: #ffffff;
      padding: 16px 36px;
      border-radius: 9999px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .pin-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 82px;
      font-weight: 700;
      line-height: 1.15;
      color: #2b1f1d;
      margin: 40px 0 20px;
    }
    .pin-title span.highlight {
      color: #c84b23;
      background: #faeee3;
      padding: 4px 18px;
      border-radius: 16px;
    }
    .pin-subtitle {
      font-size: 38px;
      line-height: 1.4;
      color: #5c4e4b;
      font-weight: 500;
    }
    .pin-image-box {
      width: 100%;
      height: 600px;
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 20px 30px -8px rgba(0, 0, 0, 0.15);
      margin: 30px 0;
      background: #fff;
    }
    .pin-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .pin-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 3px dashed #e8d3c2;
      padding-top: 35px;
    }
    .pin-domain {
      font-size: 34px;
      font-weight: 800;
      color: #2b1f1d;
      letter-spacing: -0.02em;
    }
    .pin-cta {
      background: #c84b23;
      color: #ffffff;
      padding: 18px 42px;
      border-radius: 9999px;
      font-size: 28px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="pin-canvas">
    <div>
      <div class="badge-pill">25-Minute One Skillet Dinner</div>
      <h1 class="pin-title">Creamy Garlic Butter <span class="highlight">Tuscan Chicken</span></h1>
      <p class="pin-subtitle">Tender chicken in rich parmesan garlic cream with sun-dried tomatoes and spinach.</p>
    </div>

    <div class="pin-image-box">
      <img src="../placeholder.svg" alt="Creamy Garlic Butter Tuscan Chicken">
    </div>

    <div class="pin-footer">
      <div class="pin-domain">FastFlavored.com</div>
      <div class="pin-cta">Get Recipe &rarr;</div>
    </div>
  </div>

</body>
</html>
